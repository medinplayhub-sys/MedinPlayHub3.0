name: Compilar APK Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar-apk:
    name: Compilar APK de depuración
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecución al Wrapper
        run: chmod +x ./gradlew

      - name: Compilar la aplicación Android
        run: ./gradlew :app:assembleDebug

      - name: Subir el APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
